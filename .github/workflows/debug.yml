#!/usr/bin/env python3
"""複勝オッズAPI(type=2)の実レスポンス構造をActionsで1回だけ確認する使い捨て診断。
   使い方: python debug_place_odds.py <race_id>
   目的: get_place_odds が arr[0]=下限, arr[1]=上限 と仮定している並びが実際に正しいか、
         単勝(type=1)と生JSONを並べて目視確認する（推測を実データで検証）。"""
import sys, json
sys.path.insert(0, "scraper")
import netkeiba as nk

rid = sys.argv[1] if len(sys.argv) > 1 else None
if not rid:
    print("race_id を渡してください（例: 202602010111）"); sys.exit(1)

for t, label in (("1", "単勝"), ("2", "複勝")):
    url = f"{nk.BASE_RACE}/api/api_get_jra_odds.html?race_id={rid}&type={t}&action=init"
    try:
        data = json.loads(nk.get(url))
        odds = (data.get("data") or {}).get("odds") or {}
        block = odds.get(t) or {}
        print(f"\n=== type={t} ({label}) 先頭3頭の生配列 ===")
        for i, (uma, arr) in enumerate(sorted(block.items(), key=lambda x: int(x[0]))):
            if i >= 3: break
            print(f"  馬番{uma}: {arr!r}")
        print(f"  → get_place_odds解釈:", dict(list(nk.get_place_odds(rid).items())[:3]) if t == "2" else "-")
    except Exception as e:
        print(f"type={t} 失敗: {e}")
print("\n複勝の配列が [下限, 上限] の並びなら get_place_odds はそのままでOK。")
print("並びが違う場合は netkeiba.get_place_odds の arr[0]/arr[1] を実際の位置に直す。")
